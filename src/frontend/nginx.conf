# Phục vụ giao diện đã dựng và chuyển /api, /health sang dịch vụ api trong mạng của docker compose.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;        # "api" là TÊN DỊCH VỤ trong docker-compose.yml, không phải localhost
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /health {
    proxy_pass http://api:3000;
  }

  # Ứng dụng một trang: đường dẫn lạ trả index.html để React tự điều hướng.
  location / {
    try_files $uri /index.html;
  }
}
